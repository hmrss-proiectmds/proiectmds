# Render.com blueprint — deploys backend API + frontend static site
# https://render.com/docs/blueprint-spec
#
# Setup:
#   1. Push this file to your repo root on GitHub
#   2. In Render dashboard: New → Blueprint → connect this repo
#   3. Set the env vars marked "sync: false" as Render secrets
#
# Services deployed:
#   - gameplatform-api   (Docker, FastAPI backend)
#   - gameplatform-web   (Static site, React/Vite frontend)
#   - gameplatform-db    (Managed PostgreSQL)
#   - gameplatform-redis (Managed Redis)

databases:
  - name: gameplatform-db
    databaseName: gameplatform
    user: gameplatform
    plan: free

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: gameplatform-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gameplatform-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: gameplatform-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: gameplatform-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: https://gameplatform-web.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false   # Set this manually in Render dashboard as a secret

  # ── Redis ────────────────────────────────────────────────────────────────────
  - type: redis
    name: gameplatform-redis
    plan: free
    ipAllowList: []   # Allow all internal traffic

  # ── Frontend static site ─────────────────────────────────────────────────────
  - type: web
    name: gameplatform-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
